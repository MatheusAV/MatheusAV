name: Snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar animacao da cobra
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: MatheusAV
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E23636&color_dots=#0d1117,#3d0d12,#8a121f,#c02030,#E23636

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
