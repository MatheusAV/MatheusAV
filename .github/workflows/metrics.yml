name: Metrics

# Antes de rodar: crie um token classico em https://github.com/settings/tokens
# (escopo: read:user + public_repo) e salve como secret METRICS_TOKEN neste repositorio.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Metrics geral
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatheusAV
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6

      - name: Metrics calendario isometrico
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatheusAV
          filename: assets/metrics-calendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
