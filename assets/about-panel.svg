<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Sobre mim"><title>Sobre mim</title><defs><radialGradient id="gab" cx="92%" cy="0%" r="75%"><stop offset="0%" stop-color="#E23636" stop-opacity="0.18"/><stop offset="100%" stop-color="#E23636" stop-opacity="0"/></radialGradient><clipPath id="cab"><rect width="1200" height="430" rx="14"/></clipPath></defs><g clip-path="url(#cab)"><rect width="1200" height="430" fill="#000000"/><rect width="1200" height="430" fill="url(#gab)"/><g opacity="0.5"><path d="M1220,-20 L1105,630 M1220,-20 L981,595 M1220,-20 L865,537 M1220,-20 L764,457 M1220,-20 L679,359 M1220,-20 L616,246 M1220,-20 L576,123 M1220,-20 L560,-6 M1220,-20 L570,-135" fill="none" stroke="#2A313D" stroke-width="0.9"/><path d="M1206,59 Q1201,49 1191,55 Q1187,44 1177,47 Q1176,37 1165,38 Q1165,27 1154,26 Q1157,15 1147,12 Q1152,2 1142,-3 Q1149,-11 1140,-18 Q1148,-25 1141,-34 M1192,138 Q1181,119 1162,129 Q1155,108 1134,115 Q1131,93 1109,96 Q1111,74 1089,72 Q1095,51 1074,44 Q1083,25 1064,15 Q1077,-3 1060,-17 Q1076,-31 1062,-48 M1177,226 Q1159,197 1129,213 Q1118,181 1086,191 Q1081,157 1047,161 Q1049,126 1015,123 Q1024,90 991,81 Q1006,50 976,34 Q997,7 970,-15 Q996,-37 974,-63 M1157,335 Q1133,292 1090,316 Q1074,269 1027,284 Q1020,235 971,240 Q974,191 925,186 Q938,139 890,125 Q912,81 869,58 Q898,19 860,-12 Q897,-45 865,-83 M1133,472 Q1099,413 1039,446 Q1017,381 951,402 Q942,334 874,341 Q878,273 810,267 Q828,201 762,181 Q792,120 732,88 Q773,34 720,-9 Q771,-54 728,-107 M1105,630 Q1060,552 981,595 Q951,510 865,537 Q853,447 764,457 Q769,367 679,359 Q702,271 616,246 Q655,165 576,123 Q630,51 560,-6 Q628,-65 570,-135" fill="none" stroke="#232A35" stroke-width="0.9"/></g><rect x="0" y="0" width="5" height="430" fill="#E23636"/><text x="42" y="52" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan>Desenvolvedor </tspan><tspan font-weight="bold" fill="#F2F5FA">backend .NET</tspan><tspan> em São Paulo. Construo </tspan><tspan font-weight="bold" fill="#F2F5FA">APIs REST</tspan><tspan> com ASP.NET Core</tspan></text><text x="42" y="74" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan>pensando em arquitetura antes de código: </tspan><tspan font-weight="bold" fill="#F2F5FA">Clean Architecture</tspan><tspan>, </tspan><tspan font-weight="bold" fill="#F2F5FA">DDD</tspan><tspan>, </tspan><tspan font-weight="bold" fill="#F2F5FA">CQRS</tspan><tspan> e</tspan></text><text x="42" y="96" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan font-weight="bold" fill="#F2F5FA">SOLID</tspan><tspan> não são enfeite de README aqui — são a forma como os projetos deste perfil</tspan></text><text x="42" y="118" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan>estão organizados.</tspan></text><text x="42" y="162" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan>No dia a dia trabalho com </tspan><tspan font-weight="bold" fill="#F2F5FA">C#</tspan><tspan>, </tspan><tspan font-weight="bold" fill="#F2F5FA">Entity Framework Core</tspan><tspan>, </tspan><tspan font-weight="bold" fill="#F2F5FA">SQL Server</tspan><tspan>,</tspan></text><text x="42" y="184" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan font-weight="bold" fill="#F2F5FA">PostgreSQL</tspan><tspan>, </tspan><tspan font-weight="bold" fill="#F2F5FA">MongoDB</tspan><tspan> e </tspan><tspan font-weight="bold" fill="#F2F5FA">Redis</tspan><tspan>, com autenticação </tspan><tspan font-weight="bold" fill="#F2F5FA">JWT</tspan><tspan>, tempo real via</tspan></text><text x="42" y="206" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan font-weight="bold" fill="#F2F5FA">SignalR</tspan><tspan>, logs estruturados com </tspan><tspan font-weight="bold" fill="#F2F5FA">Serilog</tspan><tspan>, testes com </tspan><tspan font-weight="bold" fill="#F2F5FA">xUnit</tspan><tspan> e </tspan><tspan font-weight="bold" fill="#F2F5FA">Docker</tspan><tspan>.</tspan></text><text x="42" y="228" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="13.5" fill="#C6D0DE"><tspan>No frontend, entrego a ponta com </tspan><tspan font-weight="bold" fill="#F2F5FA">Angular</tspan><tspan> e </tspan><tspan font-weight="bold" fill="#F2F5FA">TypeScript</tspan><tspan>.</tspan></text><rect x="38" y="262" width="640" height="150" rx="10" fill="#06080D" stroke="#E23636" stroke-opacity="0.35"/><text x="56" y="288" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" xml:space="preserve"><tspan fill="#FF6B6B" xml:space="preserve">public sealed class </tspan><tspan fill="#7FA8FF" xml:space="preserve">Matheus</tspan><tspan fill="#8B94A3" xml:space="preserve"> : </tspan><tspan fill="#7BC62D" xml:space="preserve">IBackendDeveloper</tspan></text><text x="56" y="307" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" xml:space="preserve"><tspan fill="#8B94A3" xml:space="preserve">{</tspan></text><text x="56" y="326" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" xml:space="preserve"><tspan fill="#FF6B6B" xml:space="preserve">    public string   </tspan><tspan fill="#E6ECF5" xml:space="preserve">Role</tspan><tspan fill="#8B94A3" xml:space="preserve">       => </tspan><tspan fill="#E8B84B" xml:space="preserve">".NET Backend Developer"</tspan><tspan fill="#8B94A3" xml:space="preserve">;</tspan></text><text x="56" y="345" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" xml:space="preserve"><tspan fill="#FF6B6B" xml:space="preserve">    public string   </tspan><tspan fill="#E6ECF5" xml:space="preserve">Location</tspan><tspan fill="#8B94A3" xml:space="preserve">   => </tspan><tspan fill="#E8B84B" xml:space="preserve">"São Paulo, Brasil"</tspan><tspan fill="#8B94A3" xml:space="preserve">;</tspan></text><text x="56" y="364" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" xml:space="preserve"><tspan fill="#FF6B6B" xml:space="preserve">    public string[] </tspan><tspan fill="#E6ECF5" xml:space="preserve">Focus</tspan><tspan fill="#8B94A3" xml:space="preserve">      => [</tspan><tspan fill="#E8B84B" xml:space="preserve">"Clean Architecture", "DDD", "CQRS"</tspan><tspan fill="#8B94A3" xml:space="preserve">];</tspan></text><text x="56" y="383" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" xml:space="preserve"><tspan fill="#FF6B6B" xml:space="preserve">    public bool     </tspan><tspan fill="#E6ECF5" xml:space="preserve">OpenToWork</tspan><tspan fill="#8B94A3" xml:space="preserve"> => </tspan><tspan fill="#7FA8FF" xml:space="preserve">true</tspan><tspan fill="#8B94A3" xml:space="preserve">;</tspan></text><text x="56" y="402" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="11.5" xml:space="preserve"><tspan fill="#8B94A3" xml:space="preserve">}</tspan></text><rect x="712" y="0" width="448" height="430" fill="#04060B" opacity="0.55"/><rect x="712" y="283" width="54" height="147" fill="#080C14"/><rect x="720" y="297" width="4" height="6" fill="#E23636" fill-opacity="0.35"/><rect x="750" y="369" width="4" height="6" fill="#E23636" fill-opacity="0.75"/><rect x="770" y="354" width="46" height="76" fill="#080C14"/><rect x="793" y="368" width="4" height="6" fill="#E23636" fill-opacity="0.75"/><rect x="820" y="293" width="37" height="137" fill="#080C14"/><rect x="843" y="331" width="4" height="6" fill="#E23636" fill-opacity="0.35"/><rect x="828" y="379" width="4" height="6" fill="#E23636" fill-opacity="0.35"/><rect x="865" y="284" width="61" height="146" fill="#080C14"/><rect x="903" y="322" width="4" height="6" fill="#E23636" fill-opacity="0.75"/><rect x="903" y="370" width="4" height="6" fill="#E23636" fill-opacity="0.55"/><rect x="873" y="394" width="4" height="6" fill="#E23636" fill-opacity="0.35"/><rect x="930" y="311" width="45"